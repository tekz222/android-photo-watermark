name: Build Flutter (iOS + Android)

# Builds the Flutter app in flutter_app/. The iOS job runs on a macOS runner and
# produces an UNSIGNED .ipa artifact (installable only after you add your own
# Apple signing). The Android job produces a debug APK.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-planck-j4zlq6]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-build.yml'

jobs:
  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders (keep our lib/ and pubspec)
        run: |
          cp -R lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=ios,android --org com.tekz --project-name photo_watermark .
          rm -rf lib && cp -R /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Add iOS photo-library permissions
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Para escolher fotos e logos.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Para escolher fotos e logos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Para salvar as fotos com marca dágua na galeria.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Para salvar as fotos com marca dágua na galeria.'" "$PLIST"

      - run: flutter pub get

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging $APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qr ../PhotoWatermark-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: flutter_app/build/PhotoWatermark-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders (keep our lib/ and pubspec)
        run: |
          cp -R lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=ios,android --org com.tekz --project-name photo_watermark .
          rm -rf lib && cp -R /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
