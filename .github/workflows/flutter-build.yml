name: Build iOS app

# Builds the Flutter app in flutter_app/ on a macOS runner and publishes an
# UNSIGNED .ipa (+ AltStore source) to the 'ios-latest' release. iOS only.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-planck-j4zlq6]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-build.yml'

jobs:
  ios:
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders (keep our lib/ and pubspec)
        run: |
          cp -R lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=ios,android --org com.tekz --project-name photo_watermark .
          rm -rf lib && cp -R /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Add iOS photo-library permissions and app name
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Para escolher fotos e logos.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Para escolher fotos e logos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Para salvar as fotos com marca dágua na galeria.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Para salvar as fotos com marca dágua na galeria.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'JCV Watermarker'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'JCV Watermarker'" "$PLIST"

      - name: Set iOS deployment target to 15.5 (required by ML Kit)
        run: |
          # Podfile: uncomment/replace the platform line.
          if grep -q "platform :ios" ios/Podfile; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '15.5'/" ios/Podfile
            sed -i '' "s/^platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          else
            printf "platform :ios, '15.5'\n%s" "$(cat ios/Podfile)" > ios/Podfile
          fi
          # Runner project: bump deployment target everywhere.
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          echo "----- Podfile head -----"; head -5 ios/Podfile

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build unsigned iOS app
        run: |
          # Builds the app bundle. The final code-sign/export step may complain
          # about a Development Team; we ignore that and package the .app it
          # already produced (it gets signed later by Sideloadly/AltStore).
          # Version grows with the CI run number so AltStore detects updates.
          flutter build ios --release --no-codesign \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} || true
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "Runner.app was not produced"; ls -R build/ios || true; exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qr ../PhotoWatermark-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: flutter_app/build/PhotoWatermark-unsigned.ipa

      - name: Publish IPA to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Latest iOS build
          body: |
            Build mais recente do app iOS (não assinado).
            Instale com o Sideloadly:
            https://github.com/${{ github.repository }}/releases/download/ios-latest/PhotoWatermark-unsigned.ipa
          files: flutter_app/build/PhotoWatermark-unsigned.ipa
