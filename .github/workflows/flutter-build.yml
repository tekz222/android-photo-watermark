name: Build Flutter (iOS + Android)

# Builds the Flutter app in flutter_app/. The iOS job runs on a macOS runner and
# produces an UNSIGNED .ipa artifact (installable only after you add your own
# Apple signing). The Android job produces a debug APK.

on:
  workflow_dispatch:
  push:
    branches: [claude/charming-planck-j4zlq6]
    paths:
      - 'flutter_app/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/flutter-build.yml'

jobs:
  ios:
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders (keep our lib/ and pubspec)
        run: |
          cp -R lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=ios,android --org com.tekz --project-name photo_watermark .
          rm -rf lib && cp -R /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Add iOS photo-library permissions and app name
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Para escolher fotos e logos.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Para escolher fotos e logos.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Para salvar as fotos com marca dágua na galeria.'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Para salvar as fotos com marca dágua na galeria.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'JCV Watermarker'" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'JCV Watermarker'" "$PLIST"

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build unsigned iOS app
        run: |
          # Builds the app bundle. The final code-sign/export step may complain
          # about a Development Team; we ignore that and package the .app it
          # already produced (it gets signed later by Sideloadly).
          flutter build ios --release --no-codesign || true
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "Runner.app was not produced"; ls -R build/ios || true; exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qr ../PhotoWatermark-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: flutter_app/build/PhotoWatermark-unsigned.ipa

      - name: Build AltStore source manifest
        run: |
          IPA=build/PhotoWatermark-unsigned.ipa
          SIZE=$(stat -f%z "$IPA")
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          DATE=$(date +%F)
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" build/ios/iphoneos/Runner.app/Info.plist)
          BASE="https://github.com/${{ github.repository }}/releases/download/ios-latest"
          cp assets/launcher_icon.png build/icon.png
          cat > build/apps.json <<EOF
          {
            "name": "JCV Watermarker",
            "identifier": "com.tekz.jcvwatermarker.source",
            "sourceURL": "$BASE/apps.json",
            "apps": [
              {
                "name": "JCV Watermarker",
                "bundleIdentifier": "$BID",
                "developerName": "tekz",
                "subtitle": "Marca d'agua em lote nas fotos",
                "localizedDescription": "Aplique uma ou varias logos em lote nas suas fotos, salvando todas de uma vez.",
                "iconURL": "$BASE/icon.png",
                "tintColor": "05B2AE",
                "category": "photo-video",
                "screenshotURLs": [],
                "version": "$VERSION",
                "versionDate": "$DATE",
                "versionDescription": "Build mais recente.",
                "downloadURL": "$BASE/PhotoWatermark-unsigned.ipa",
                "size": $SIZE,
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "localizedDescription": "Build mais recente.",
                    "downloadURL": "$BASE/PhotoWatermark-unsigned.ipa",
                    "size": $SIZE,
                    "minOSVersion": "12.0"
                  }
                ]
              }
            ]
          }
          EOF
          echo "----- apps.json -----"; cat build/apps.json

      - name: Publish IPA + AltStore source to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Latest builds (iOS + Android)
          body: |
            Build mais recente do app iOS (não assinado) para instalar via AltStore.
            Adicione esta fonte no AltStore:
            https://github.com/${{ github.repository }}/releases/download/ios-latest/apps.json
          files: |
            flutter_app/build/PhotoWatermark-unsigned.ipa
            flutter_app/build/apps.json
            flutter_app/build/icon.png

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold platform folders (keep our lib/ and pubspec)
        run: |
          cp -R lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=ios,android --org com.tekz --project-name photo_watermark .
          rm -rf lib && cp -R /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Set Android app name
        run: |
          sed -i 's/android:label="photo_watermark"/android:label="JCV Watermarker"/' \
            android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

  # The real Android app is the native Kotlin app at the repo root. Build its
  # optimized (R8) release APK and publish it to the same release as the iOS app.
  android-native:
    runs-on: ubuntu-latest
    needs: ios
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build native release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK for release
        run: cp app/build/outputs/apk/release/app-release.apk JCV-Watermarker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: native-android-apk
          path: JCV-Watermarker.apk

      - name: Publish native APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Latest builds (iOS + Android)
          files: JCV-Watermarker.apk
