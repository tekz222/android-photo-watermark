name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: ./flutter_app
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Run tests
        working-directory: ./flutter_app
        run: flutter test

  build-windows:
    name: Build Windows (verify)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get
      - name: Configure Windows desktop
        working-directory: ./flutter_app
        run: flutter create --platforms=windows .
      - name: Configure CMake with VS 2022
        working-directory: ./flutter_app
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build/windows -S windows
      - name: Build Windows Release
        working-directory: ./flutter_app
        run: flutter build windows --release
      - name: Verify output exists
        run: Test-Path flutter_app/build/windows/x64/runner/Release/photo_watermark.exe
        shell: pwsh