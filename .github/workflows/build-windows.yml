name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Scaffold Windows platform folder
        working-directory: ./flutter_app
        run: flutter create --platforms=windows .

      - name: Set window title
        working-directory: ./flutter_app
        run: sed -i 's/L"photo_watermark"/L"JCV Watermarker"/' windows/runner/main.cpp

      - name: Generate app icon
        working-directory: ./flutter_app
        run: dart run flutter_launcher_icons

      - name: Build Windows Release
        working-directory: ./flutter_app
        run: flutter build windows --release

      - name: Package as ZIP
        working-directory: ./flutter_app
        run: |
          cd build/windows/x64/runner
          mv Release/photo_watermark.exe "Release/JCV Watermarker.exe"
          mv Release "JCV Watermarker"
          7z a ../../../JCV-Watermarker-Windows.zip "JCV Watermarker"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            flutter_app/build/JCV-Watermarker-Windows.zip
          body: |
            ## JCV Photo Watermarker - Windows Release

            ### Installation
            1. Download `JCV-Watermarker-Windows.zip`
            2. Extract the ZIP
            3. Run `JCV Watermarker.exe` (no installation required)

            ### Features
            - Batch watermark photos with logos and text
            - Multiple logo sets (Set A / Set B / Auto Multi-Set)
            - Automatic logo distribution and sizing
            - Custom per-image settings
            - Export with date/time prefix

            ### Requirements
            - Windows 10/11 (x64)
            - No additional dependencies

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-watermark-windows
          path: flutter_app/build/JCV-Watermarker-Windows.zip
          retention-days: 30