name: photo_watermark
description: Aplique logos e textos em lote nas suas fotos (Windows).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  image: ^4.2.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/default_corner_logo.png
    - assets/appbar_logo.png

# Windows .exe icon (the CI job scaffolds only the windows/ folder).
flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/launcher_icon.png"
  windows:
    generate: true
    image_path: "assets/launcher_icon.png"
    icon_size: 256
