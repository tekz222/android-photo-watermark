name: photo_watermark
description: Aplique uma ou várias logos em lote nas suas fotos (iOS e Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  image: ^4.2.0
  gal: ^2.3.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/default_corner_logo.png
    - assets/appbar_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#05B2AE"
  adaptive_icon_background: "#05B2AE"
  adaptive_icon_foreground: "assets/launcher_icon_fg.png"
