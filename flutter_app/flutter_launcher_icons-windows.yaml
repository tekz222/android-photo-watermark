# Icon config used ONLY by the Windows CI job (which scaffolds just the
# windows/ folder — the pubspec config would try to write Android/iOS icons
# into folders that don't exist there).
flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/launcher_icon.png"
  windows:
    generate: true
    image_path: "assets/launcher_icon.png"
    icon_size: 256
